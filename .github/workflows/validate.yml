name: Validate project registry

on:
  push:
    branches: [main]
    paths:
      - 'projects.json'
      - 'scripts/validate-projects.mjs'
      - 'resonance-3d-audio-visualizer/**'
      - 'assets/**'
      - '.github/workflows/validate.yml'
  pull_request:
    branches: [main]
    paths:
      - 'projects.json'
      - 'scripts/validate-projects.mjs'
      - 'resonance-3d-audio-visualizer/**'
      - 'assets/**'
      - '.github/workflows/validate.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate project registry
        run: node scripts/validate-projects.mjs
