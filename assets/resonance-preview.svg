<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">Resonance audio visualizer preview</title><desc id="desc">Dark audio visualizer interface with a luminous three-dimensional sound wave and circular spectrum.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101323"/><stop offset="1" stop-color="#20294b"/></linearGradient>
 <radialGradient id="glow"><stop stop-color="#8c7bff" stop-opacity=".55"/><stop offset="1" stop-color="#8c7bff" stop-opacity="0"/></radialGradient>
 <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#49d6ff"/><stop offset=".5" stop-color="#9b86ff"/><stop offset="1" stop-color="#ff70c8"/></linearGradient>
 <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
</defs>
<rect width="1200" height="760" rx="34" fill="url(#bg)"/>
<circle cx="690" cy="360" r="290" fill="url(#glow)" filter="url(#blur)"/>
<g opacity=".2" stroke="#aeb8ff" fill="none"><path d="M0 150H1200M0 250H1200M0 350H1200M0 450H1200M0 550H1200M150 0V760M300 0V760M450 0V760M600 0V760M750 0V760M900 0V760M1050 0V760"/></g>
<rect x="40" y="36" width="1120" height="688" rx="24" fill="none" stroke="#9ba6db" stroke-opacity=".24"/>
<g fill="#f4f5ff" font-family="Arial,sans-serif"><text x="78" y="94" font-size="26" font-weight="700" letter-spacing="5">RESONANCE</text><text x="78" y="124" font-size="12" fill="#aab1d2" letter-spacing="3">REAL-TIME AUDIO VISUALIZER</text><text x="1060" y="91" font-size="12" fill="#aab1d2" text-anchor="end">LIVE / 01</text></g>
<g transform="translate(680 380)" fill="none" stroke="url(#wave)" stroke-width="3">
 <ellipse rx="300" ry="110" transform="rotate(-18)" opacity=".35"/><ellipse rx="260" ry="150" transform="rotate(32)" opacity=".45"/><ellipse rx="210" ry="205" transform="rotate(-52)" opacity=".6"/>
 <path d="M-310 0 C-250 -8 -245 -100 -190 -100 S-120 110 -70 110 S-20 -160 30 -160 S90 150 140 150 S210 -75 260 -75 S290 0 320 0" stroke-width="5"/>
 <path d="M-310 20 C-250 15 -240 -55 -190 -55 S-125 75 -70 75 S-15 -120 30 -120 S95 120 140 120 S210 -35 260 -35 S290 20 320 20" opacity=".55"/>
</g>
<g transform="translate(680 380)" fill="#d8d6ff"><circle cx="0" cy="0" r="5"/><circle cx="-190" cy="-100" r="4"/><circle cx="140" cy="150" r="4"/><circle cx="260" cy="-75" r="4"/></g>
<g fill="#aab1d2" font-family="Arial,sans-serif" font-size="13"><text x="78" y="650">SPECTRUM</text><text x="78" y="680" fill="#f4f5ff" font-size="18">SPHERICAL / 3D MODE</text><text x="1090" y="650" text-anchor="end">00:42</text><text x="1090" y="680" text-anchor="end">● PLAYING</text></g>
<g transform="translate(80 180)" fill="#aab1d2"><rect width="190" height="4" rx="2" fill="#667099"/><rect width="112" height="4" rx="2" fill="#8f85ff"/><circle cx="112" cy="2" r="6" fill="#fff"/></g>
</svg>